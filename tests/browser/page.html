<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#fff">
<script>
  customElements.define("ha-icon", class extends HTMLElement { connectedCallback(){ this.textContent = this.getAttribute("icon") || ""; } });
  customElements.define("ha-textfield", class extends HTMLElement {});
  window.calls = [];
  window.scenario = {
    recipes: { items: [{ id: "r1", slug: "soup", name: "Suppe", image_url: "/img/r1" }] },
    detail: { soup: { id: "r1", slug: "soup", name: "Suppe", image_url: "/img/r1", orgURL: "https://example.com/original-soup", recipeServings: 4, tags: [{ name: "vegan" }], recipeIngredient: [{ quantity: 1, unit: { name: "Stück" }, food: { name: "Zwiebel" }, note: "", display: "1 Stück Zwiebel" }], recipeInstructions: [{ text: "Zwiebel schneiden." }] } },
    deleteRecipe: { ok: true },
    tags: { items: [{ name: "vegan", slug: "vegan" }, { name: "schnell", slug: "schnell" }] },
    shopping: { items: [{ id: "i1", display: "1 Banane", checked: false }, { id: "i2", display: "Milch", checked: true }] },
    deleteShoppingItem: { ok: true },
    clearChecked: { ok: true },
    // The real backend's import queue lives server-side (import_queue.py) and never
    // replies with a result directly — POST just enqueues (or starts immediately if
    // idle) and returns right away; the card learns what happened by polling GET.
    // These two mirror that: importState is the "server" state, importDuplicates
    // simulates the backend's pre-enqueue duplicate check (by URL -> existing slug).
    importState: { queue: [], running: null, history: [] },
    importDuplicates: {},
  };
  window.finishCurrentImportJob = (result) => {
    const s = window.scenario.importState;
    if (!s.running) return;
    const url = s.running.url;
    s.history.unshift({ url, ...result });
    const next = s.queue.shift();
    s.running = next ? { url: next.url, started_at: Date.now() / 1000 } : null;
  };
  window.hassStub = {
    connection: {},
    callWS: async (msg) => { window.calls.push({ ws: msg }); return { path: (msg.path || "") + "?authSig=stub" }; },
    callApi: async (method, path, body) => {
      window.calls.push({ method, path, body });
      if (method === "GET" && path === "mealie_hub/tags") return window.scenario.tags;
      if (method === "GET" && path.startsWith("mealie_hub/recipes") && !path.includes("mealie_hub/recipes/")) return window.scenario.recipes;
      if (method === "GET" && path.startsWith("mealie_hub/recipes/")) {
        const slug = path.split("/").pop();
        const r = window.scenario.detail[slug];
        if (!r) throw { status: 404, body: { error: "not found" } };
        return r;
      }
      if (method === "PATCH" && path.endsWith("/tags")) return { tags: (body.tags || []).map((t) => ({ name: t })) };
      if (method === "DELETE" && path.startsWith("mealie_hub/recipes/")) {
        const r = window.scenario.deleteRecipe;
        if (!r.ok) throw { status: r.status || 500, body: { error: r.error || "boom" } };
        return { ok: true };
      }
      if (method === "GET" && path === "mealie_hub/shopping-list") {
        if (window.scenario.shopping.error) throw { status: 404, body: { error: window.scenario.shopping.error } };
        return window.scenario.shopping;
      }
      if (method === "PUT" && path.startsWith("mealie_hub/shopping-list/items/")) return { ok: true };
      if (method === "DELETE" && path.startsWith("mealie_hub/shopping-list/items/")) {
        const r = window.scenario.deleteShoppingItem;
        if (!r.ok) throw { status: r.status || 500, body: { error: r.error || "boom" } };
        return { ok: true };
      }
      if (method === "POST" && path === "mealie_hub/shopping-list/clear-checked") {
        const r = window.scenario.clearChecked;
        if (!r.ok) throw { status: r.status || 500, body: { error: r.error || "boom" } };
        return { removed: (window.scenario.shopping.items || []).filter((i) => i.checked).length };
      }
      if (method === "POST" && path.endsWith("/shopping-list")) return { ok: true };
      if (method === "POST" && path === "mealie_hub/import") {
        const dupSlug = window.scenario.importDuplicates[body.url];
        if (dupSlug && !body.force) throw { status: 409, body: { error: "duplicate", slug: dupSlug } };
        const s = window.scenario.importState;
        if (s.running) s.queue.push({ url: body.url, force: !!body.force });
        else s.running = { url: body.url, started_at: Date.now() / 1000 };
        return { queued: true };
      }
      if (method === "GET" && path === "mealie_hub/import") return window.scenario.importState;
      if (method === "POST" && path === "mealie_hub/import/cancel") {
        const s = window.scenario.importState;
        const i = s.queue.findIndex((q) => q.url === body.url);
        if (i >= 0) { s.queue.splice(i, 1); return { removed: true }; }
        return { removed: false };
      }
      return {};
    },
  };
</script>
<script src="/mealie-card.js" charset="utf-8"></script>
</body></html>
